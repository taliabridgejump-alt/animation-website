<svg width="100" height="160" viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg">
    <!-- Stick-man Character Waving -->
    <g id="stickman-waving">
        <!-- Head -->
        <circle cx="50" cy="20" r="15" fill="none" stroke="#333" stroke-width="2.5"/>
        <!-- Body -->
        <line x1="50" y1="35" x2="50" y2="80" stroke="#333" stroke-width="2.5"/>
        <!-- Left arm (waving up) -->
        <line x1="50" y1="45" x2="30" y2="30" stroke="#333" stroke-width="2.5"/>
        <!-- Right arm -->
        <line x1="50" y1="45" x2="75" y2="65" stroke="#333" stroke-width="2.5"/>
        <!-- Left leg -->
        <line x1="50" y1="80" x2="30" y2="120" stroke="#333" stroke-width="2.5"/>
        <!-- Right leg -->
        <line x1="50" y1="80" x2="70" y2="120" stroke="#333" stroke-width="2.5"/>
    </g>
</svg>
