<svg width="100" height="160" viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg">
    <!-- Stick-man Character Jumping -->
    <g id="stickman-jumping">
        <!-- Head -->
        <circle cx="50" cy="20" r="15" fill="none" stroke="#333" stroke-width="2.5"/>
        <!-- Body -->
        <line x1="50" y1="35" x2="50" y2="70" stroke="#333" stroke-width="2.5"/>
        <!-- Left arm (up) -->
        <line x1="50" y1="40" x2="30" y2="25" stroke="#333" stroke-width="2.5"/>
        <!-- Right arm (up) -->
        <line x1="50" y1="40" x2="70" y2="25" stroke="#333" stroke-width="2.5"/>
        <!-- Left leg (bent) -->
        <line x1="50" y1="70" x2="35" y2="90" stroke="#333" stroke-width="2.5"/>
        <!-- Right leg (bent) -->
        <line x1="50" y1="70" x2="65" y2="90" stroke="#333" stroke-width="2.5"/>
    </g>
</svg>
